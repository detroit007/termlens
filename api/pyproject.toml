[project]
name = "api"
version = "0.1.0"
description = "TermLens API - AI Concept Explainer for School Students"
readme = "README.md"
authors = [
    { name = "Hamza Yousaf", email = "hamzayousaf056@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-google-genai>=4.4.2",
    "langchain-ollama>=1.1.0",
    "pytest>=9.1.1",
    "sqlmodel>=0.0.48",
    "sse-starlette>=3.5.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
